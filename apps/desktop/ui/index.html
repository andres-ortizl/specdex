<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>specdex — fleet</title>
  <script>
    // Resolve theme before first paint to avoid a flash.
    (function () {
      var s = localStorage.dexTheme || 'light';
      var t = s === 'system'
        ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        : s;
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" id="brand-home" href="#" aria-label="Back to fleet">
      <span class="brand-mark" aria-hidden="true"></span>
      <h1 class="brand-name">specdex</h1>
      <span class="brand-sub">fleet</span>
    </a>

    <div class="topbar-right">
      <div class="fleet-sort" id="fleet-sort" role="group" aria-label="Sort specs">
        <button type="button" data-sort="recent">Recent</button>
        <button type="button" data-sort="state">State</button>
        <button type="button" data-sort="name">Name</button>
      </div>
      <span class="fleet-count" id="fleet-count"></span>
      <span class="topbar-sep" aria-hidden="true"></span>
      <button class="theme-toggle" id="theme-toggle" type="button"
              aria-pressed="false" aria-label="Toggle dark mode" title="Theme: light">
        <span class="t-track" aria-hidden="true"><span class="t-knob"></span></span>
      </button>
    </div>
  </header>

  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Projects"></aside>
    <div class="content">
      <main class="fleet" id="fleet" aria-label="Running specs"></main>
      <main class="detail" id="detail" aria-label="Spec detail" hidden></main>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
